name: Dev Pre-release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signing secrets
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @('SIGNING_KEYSTORE_BASE64','SIGNING_KEY_ALIAS','SIGNING_STORE_PASSWORD','SIGNING_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw ("Missing required GitHub Actions secrets for signed dev pre-releases: " + ($missing -join ', ') + ". Add them in Repository Settings -> Secrets and variables -> Actions.")
          }
      - name: Select JDK and install SDK packages
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:JAVA_HOME | ForEach-Object { "JAVA_HOME=$_" >> $env:GITHUB_ENV }
          "$env:JAVA_HOME/bin" >> $env:GITHUB_PATH
          $manager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $manager) { throw 'Android SDK command-line tools are missing' }
          & $manager.FullName 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Check repository contents and layout
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          ./scripts/check-layout.ps1
          python scripts/compatibility-inventory.py --check
          python scripts/dev-version.py --self-test
          python scripts/check-translations.py --self-test
          python scripts/check-translations.py
      - name: Compute dev version and changelog
        shell: pwsh
        run: |
          python scripts/dev-version.py --json-out .build/dev-version.json --changelog-out .build/dev-changelog.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compute dev version' }
      - name: Build signed dev APK
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          $meta = Get-Content -LiteralPath .build/dev-version.json -Raw | ConvertFrom-Json
          $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64.Trim()))
          try {
            ./build-local.ps1 -Sdk $env:ANDROID_HOME -Keystore $ks -KeyAlias $env:SIGNING_KEY_ALIAS -StorePass $env:SIGNING_STORE_PASSWORD -KeyPass $env:SIGNING_KEY_PASSWORD -VersionName $meta.versionName -VersionCode $meta.versionCode
          } finally {
            if (Test-Path -LiteralPath $ks) { Remove-Item -LiteralPath $ks -Force }
          }
      - name: Run JVM contracts
        shell: pwsh
        run: ./test-local.ps1 -Sdk $env:ANDROID_HOME -Suite Jvm -SkipBuild
      - name: Publish pre-release and prune old dev releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $meta = Get-Content -LiteralPath .build/dev-version.json -Raw | ConvertFrom-Json
          $expectedName = "dressroom-advanced-$($meta.versionName).apk"
          $apk = Get-Item (Join-Path 'artifacts/current' $expectedName)
          python scripts/dev-version.py --append-apk $apk.FullName --changelog-out .build/dev-changelog.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to append APK digest to changelog' }
          gh release create $meta.tag $apk.FullName --target $env:GITHUB_SHA --title "Dressroom Advanced $($meta.tag)" --notes-file .build/dev-changelog.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to create pre-release $($meta.tag)" }

          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" > .build/releases.json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list existing releases for pruning' }
          $toPrune = @(python scripts/dev-version.py --prune-list .build/releases.json --keep 10)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compute prune list' }
          $prunedCount = 0
          foreach ($oldTag in $toPrune) {
            if ([string]::IsNullOrWhiteSpace($oldTag)) { continue }
            gh release delete $oldTag.Trim() --yes --cleanup-tag
            if ($LASTEXITCODE -eq 0) { $prunedCount++ }
          }

          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Tag: $($meta.tag)

          Version code: $($meta.versionCode)

          APK: $($apk.Name)

          SHA-256: $hash

          Pruned older dev pre-releases: $prunedCount
          "@ >> $env:GITHUB_STEP_SUMMARY
