name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select JDK and install SDK packages
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:JAVA_HOME | ForEach-Object { "JAVA_HOME=$_" >> $env:GITHUB_ENV }
          "$env:JAVA_HOME/bin" >> $env:GITHUB_PATH
          $manager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $manager) { throw 'Android SDK command-line tools are missing' }
          & $manager.FullName 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Check repository contents and layout
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          ./scripts/check-layout.ps1
          python scripts/compatibility-inventory.py --check
      - name: Build unsigned APK
        id: build
        shell: pwsh
        run: ./build-local.ps1 -Sdk $env:ANDROID_HOME -Unsigned
      - name: Run JVM contracts
        shell: pwsh
        run: ./test-local.ps1 -Sdk $env:ANDROID_HOME -Suite Jvm -SkipBuild
      - name: Upload unsigned APK and check results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-${{ github.sha }}
          path: |
            artifacts/current/*-unsigned.apk
            .build/tests/Jvm/results.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Build summary
        if: success()
        shell: pwsh
        run: |
          $apk = Get-Item artifacts/current/*-unsigned.apk
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          APK: $($apk.Name)

          SHA-256: $hash

          This build is unsigned. Sign it with your own key before installing.
          "@ >> $env:GITHUB_STEP_SUMMARY
